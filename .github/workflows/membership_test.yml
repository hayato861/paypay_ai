name: Membership Tests

on:
  push:
    branches: [main]
    paths:
      - "member_*.py"
      - "stripe_test_setup.py"
      - "tests/test_membership.py"
      - "requirements.txt"
      - ".github/workflows/membership_test.yml"
  pull_request:
    paths:
      - "member_*.py"
      - "stripe_test_setup.py"
      - "tests/test_membership.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
