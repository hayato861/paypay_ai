services:
  - type: web
    name: paypay-ai-members
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SERVICE_STAGE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paypay-ai-members-db
          property: connectionString
      - key: MEMBER_SESSION_SECRET
        generateValue: true
      - key: MAGIC_LINK_DELIVERY
        value: smtp
      - key: ALLOW_STRIPE_LIVE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: cron
    name: paypay-ai-premium-report
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "20 0 * * 1-5"
    dockerCommand: python3 generate_premium_report.py
    envVars:
      - key: SERVICE_STAGE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paypay-ai-members-db
          property: connectionString

databases:
  - name: paypay-ai-members-db
    databaseName: paypay_ai_members
    user: paypay_ai_members

