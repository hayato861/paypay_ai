services:
  - type: web
    name: paypay-ai-members
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SERVICE_STAGE
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MEMBER_SESSION_SECRET
        generateValue: true
      - key: MAGIC_LINK_DELIVERY
        value: resend
      - key: ALLOW_STRIPE_LIVE
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PORTAL_CONFIGURATION_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
